[project]
name = "ghosthands-cv"
version = "0.1.0"
description = "Ghost Hands: expert video -> lesson JSON (OpenCV + MediaPipe)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F: errors and undefined names, I: import order, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
